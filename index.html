<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glue</title>
    <link rel="icon" href="images/favicon.png" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="style.css" />

    <script type="module">
      import * as chrono from "https://esm.sh/chrono-node@2";
      window.chrono = chrono;
    </script>
    <script src="fetcher.js"></script>
    <script src="renderer.js"></script>
  </head>
  <body>
    <div id="bg"></div>
    <div id="api-form">
      <div>
        <h1>KN Glue</h1>
        <br />
        <p>
          A task collator for
          <a href="https://kinopio.club">Kinopio</a> with a pseudo-calendar
          defined in natural language.
        </p>
      </div>
      <br />
      <div>
        <p>
          Get your api key by going to your user profile picture → Settings →
          Developer.
        </p>
        <br />
        <p>
          This form sets your api key into local storage. It does not send it
          anywhere, ever.
        </p>
        <br />
        <div>
          <input type="text" id="api-key" name="api-key" />
          <button id="set-key">Set</button>
          <script>
            const apiKeyInput = document.getElementById("api-key");
            const setKeyButton = document.getElementById("set-key");

            const setKey = async () => {
              const apiKey = apiKeyInput.value;

              const response = await fetch("https://api.kinopio.club/user", {
                headers: {
                  Authorization: apiKey,
                },
              });

              if (response.ok) {
                localStorage.setItem("KINOPIO_API_KEY", apiKey);
                location.reload();
              } else {
                alert("Invalid key — make sure you've copied it correctly.");
              }
            };

            setKeyButton.addEventListener("click", async () => {
              await setKey();
            });

            apiKeyInput.addEventListener("keypress", async (event) => {
              if (event.key === "Enter") {
                await setKey();
              }
            });

            if (localStorage.getItem("KINOPIO_API_KEY")) {
              document.getElementById("api-form").className = "done";
            }
          </script>
        </div>
      </div>
    </div>
    <div id="render-target"></div>
  </body>
</html>
